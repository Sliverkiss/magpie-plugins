name: check

# PR 的必需门禁：合规、语义测试、实际打包清单全部通过才允许合并。
# 测试不是可选步骤；这里不提交、不发布，也不写默认分支。
# 多插件仓库：matrix.plugin 列出每个插件子目录，新增插件时加一行。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [edgeone]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 合规 + 语义测试 + 打包面预演
        working-directory: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          node scripts/check.mjs
          npm test
          npm pack --dry-run
